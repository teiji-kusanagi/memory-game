<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神経衰弱</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>神経衰弱</h1>

  <div class="status">
    <span class="stat">手数：<span id="moves">0</span>手</span>
    <span class="stat">タイム：<span id="time">0</span>秒</span>
    <span class="stat">最少：<span id="best">-</span>手</span>
    <button id="reset">最初から</button>
    <button id="sound">音：オン</button>
  </div>

  <!-- カードはscript.jsがここに並べる -->
  <div id="board"></div>

  <p id="message"></p>

  <script src="script.js"></script>
</body>
</html>
